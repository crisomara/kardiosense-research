title = "kardiosense-research gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Known-safe placeholders that look like secrets but aren't"
regexes = [
  '''your_username_here''',
  '''your_password_here''',
  '''your-gcp-project-id''',
  '''PHYSIONET_USER''',
  '''PHYSIONET_PASS''',
]

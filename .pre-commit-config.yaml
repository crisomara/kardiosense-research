# KardioSense commit hooks. Install once per clone:
#   pip install pre-commit==4.7.0
#   pre-commit install
# They run on the files in each commit and fix what they can. If a hook
# changes a file, the commit stops: look at the change, add the file again
# and commit again. CI runs the same Ruff checks on the whole repository.
# See CONTRIBUTING.md.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        files: (\.(py|ya?ml|md|toml|cfg|ini|sh|txt)|Dockerfile.*)$
      - id: end-of-file-fixer
        files: (\.(py|ya?ml|md|toml|cfg|ini|sh|txt)|Dockerfile.*)$
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      # Notebooks are allowed up to 5 MB (scripts/check_notebooks.py).
      - id: check-added-large-files
        args: [--maxkb=5120]
      - id: detect-private-key

  # Python and notebook code cells: the rules and layout in ruff.toml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        types_or: [python, pyi, jupyter]

  # Secrets: stops a commit that contains a key or password (.gitleaks.toml).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Trained weights and datasets are never published here (see README.md).
  - repo: local
    hooks:
      - id: no-weights-or-data
        name: No model weights or data files
        language: fail
        entry: Model weights and data files are not published in this repository (see README.md)
        files: \.(pt|pth|ckpt|safetensors|onnx|tflite|pb|keras|h5|hdf5|pkl|joblib|npz|npy|parquet|csv|edf|dat|hea|mat)$

target-version = "py310"
line-length = 120
extend-include = ["*.ipynb"]

[lint]
# Full default rule set (pyflakes + pycodestyle errors) for the repo's own
# Python helpers and tests.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[lint.per-file-ignores]
# The research notebooks are a record of Colab runs and carry a lot of style
# debt (f-strings without placeholders, unused imports, unsorted imports).
# In CI they are held to correctness rules only: syntax errors and undefined
# or misused names, which break a notebook when it is re-run.
"*.ipynb" = ["E4", "E7", "F401", "F403", "F405", "F541", "F811", "F841", "I", "B", "UP"]

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff and repository contents
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      # The whole repository, notebooks included (see ruff.toml).
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format
        run: ruff format --check .
      # Trained weights and datasets are never published here (README.md).
      - name: No model weights or data files
        run: |
          pattern='\.(pt|pth|ckpt|safetensors|onnx|tflite|pb|keras|h5|hdf5|pkl|joblib|npz|npy|parquet|csv|edf|dat|hea|mat)$'
          if git ls-files | grep -iE "$pattern"; then
            echo "::error::Model weights or data files are tracked (listed above)."
            exit 1
          fi

  notebooks:
    name: Notebook validation (no execution)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      # nbformat schema validation + per-notebook size budget; sizes, output
      # counts and stored error outputs are written to the job summary.
      # The notebooks are never executed in CI: they need PhysioNet / Drive /
      # BigQuery data and GPU training.
      - run: python scripts/check_notebooks.py

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - run: python -m pytest -q --cov=scripts --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

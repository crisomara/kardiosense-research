name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Uses the repo's .gitleaks.toml (default rules + placeholder allowlist).
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pip-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      # Every entry in requirements.txt is pinned, so the pins are audited
      # directly rather than resolving the full tree.
      - run: pip-audit --requirement requirements.txt --no-deps --disable-pip --progress-spinner off
      - run: pip-audit --requirement requirements-ci.txt --progress-spinner off
      # Advisory only: requirements-export.txt is the offline TFLite export
      # toolchain, pinned to TensorFlow 2.16. The onnx fixes need protobuf 6
      # and a newer TensorFlow, which means rebuilding the export path (see
      # the comment in that file). Findings show here but do not fail CI.
      - name: pip-audit (export toolchain, advisory)
        continue-on-error: true
        run: pip-audit --requirement requirements-export.txt --no-deps --disable-pip --progress-spinner off

  codeql:
    name: CodeQL (python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:python

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  actionlint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: raven-actions/actionlint@v2

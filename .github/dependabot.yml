version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types: [minor, patch]
    # The model stack is upgraded by hand, never by Dependabot: a new version
    # of these can change the numbers the notebooks report (xgboost 3, for
    # one, changes the probabilities a saved 2.x model returns). Move them in
    # a pull request that reruns the affected notebooks and records the
    # versions, then update the pins.
    ignore:
      - dependency-name: torch
      - dependency-name: numpy
      - dependency-name: scipy
      - dependency-name: scikit-learn
      - dependency-name: xgboost
      - dependency-name: shap
      - dependency-name: optuna
        update-types: ["version-update:semver-major"]
      # tensorflow 2.21 (requirements-export.txt) needs h5py older than 3.15.
      # Drop this rule when tensorflow moves to a release that allows it.
      - dependency-name: h5py
        versions: [">=3.15"]
      # pyreadstat 1.3.7 and later ship no wheel for Python 3.10, the core
      # image's Python, so pip tries to compile it and the build fails. Drop
      # this rule when the core base image moves to a newer Python.
      - dependency-name: pyreadstat
        versions: [">=1.3.7"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    # The core image's PyTorch version is its base image tag, so it is part of
    # the model stack above and is moved by hand too.
    ignore:
      - dependency-name: pytorch/pytorch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
